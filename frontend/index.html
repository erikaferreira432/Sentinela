<script>

async function login() {

  const usuario =
    document.getElementById("usuario")
      .value
      .trim();

  const senha =
    document.getElementById("senha")
      .value
      .trim();


  if (!usuario || !senha) {

    alert(
      "Digite a identificação e o código de acesso."
    );

    return;
  }


  try {

    const resposta =
      await fetch("/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          usuario: usuario,

          senha: senha

        })

      });


    const data =
      await resposta.json();


    if (!resposta.ok) {

      alert(
        data.erro ||
        "Identificação ou código de acesso inválido."
      );

      return;
    }


    if (data.tipo === "triagem") {

      window.location.href =
        "triagem.html";

      return;
    }


    if (data.tipo === "medico") {

      window.location.href =
        "medico.html";

      return;
    }


    if (data.tipo === "atendimento") {

      window.location.href =
        "atendimento.html";

      return;
    }


    alert(
      "Tipo de usuário não reconhecido."
    );


  } catch (error) {

    console.error(
      "Erro no login:",
      error
    );


    alert(
      "Não foi possível conectar ao servidor."
    );

  }

}

</script>
