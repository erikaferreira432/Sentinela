<script>

// =====================================================
// PACIENTE SELECIONADO
// =====================================================

let pacienteSelecionado = null;


// =====================================================
// ABRIR TV
// =====================================================

function abrirTV() {

  window.open(
    "tv.html",
    "_blank"
  );

}


// =====================================================
// CARREGAR PACIENTES
// =====================================================

async function carregarPacientes() {

  const div =
    document.getElementById(
      "fila-pacientes"
    );

  try {

    const resposta =
      await fetch("/pacientes");

    if (!resposta.ok) {

      throw new Error(
        "Não foi possível carregar os pacientes."
      );

    }

    const pacientes =
      await resposta.json();


    // Apenas pacientes aguardando triagem
    const fila =
      pacientes.filter(
        (p) =>
          String(
            p.status || ""
          ).toLowerCase() ===
          "triagem"
      );


    if (fila.length === 0) {

      div.innerHTML =
        `<p class="mensagem-vazia">
          Nenhum paciente aguardando triagem.
        </p>`;

      return;

    }


    div.innerHTML = "";


    fila.forEach((paciente) => {

      const item =
        document.createElement("div");

      item.className =
        "fila-item";


      const informacoes =
        document.createElement("div");


      const nome =
        document.createElement("strong");

      nome.textContent =
        paciente.nome ||
        "Paciente sem nome";


      const detalhes =
        document.createElement("small");

      detalhes.innerHTML =
        `CPF: ${
          paciente.cpf || "—"
        } | Tipo: ${
          paciente.tipo || "—"
        }`;


      informacoes.appendChild(nome);

      informacoes.appendChild(
        document.createElement("br")
      );

      informacoes.appendChild(
        detalhes
      );


      const botoes =
        document.createElement("div");


      // Botão selecionar
      const btnSelecionar =
        document.createElement("button");

      btnSelecionar.type =
        "button";

      btnSelecionar.textContent =
        "Selecionar";

      btnSelecionar.style.cssText = `
        background:#007bff;
        color:white;
        border:none;
        padding:8px 14px;
        border-radius:5px;
        cursor:pointer;
      `;


      btnSelecionar.onclick =
        () => selecionarPaciente(
          paciente
        );


      // Botão TV
      const btnTV =
        document.createElement("button");

      btnTV.type =
        "button";

      btnTV.className =
        "btn-tv";

      btnTV.textContent =
        "📺 Chamar na TV";


      btnTV.onclick =
        () => chamarNaTV(
          paciente.nome
        );


      botoes.appendChild(
        btnSelecionar
      );

      botoes.appendChild(
        btnTV
      );


      item.appendChild(
        informacoes
      );

      item.appendChild(
        botoes
      );


      div.appendChild(item);

    });

  } catch (error) {

    console.error(
      "Erro ao carregar pacientes:",
      error
    );

    div.innerHTML =
      `<p class="mensagem-erro">
        Erro ao carregar pacientes.
      </p>`;

  }

}


// =====================================================
// SELECIONAR PACIENTE
// =====================================================

function selecionarPaciente(
  paciente
) {

  pacienteSelecionado =
    paciente;


  document.getElementById(
    "nome"
  ).value =
    paciente.nome || "";


  document.getElementById(
    "resultado"
  ).style.display =
    "none";


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}


// =====================================================
// CHAMAR NA TV
// =====================================================

async function chamarNaTV(
  nome
) {

  if (!nome) {

    alert(
      "Paciente inválido."
    );

    return;

  }


  try {

    const resposta =
      await fetch(
        "/tv/chamar",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              localTipo:
                "GUICHÊ",

              localNumero:
                "01",

              paciente:
                nome

            })

        }
      );


    const data =
      await resposta.json()
        .catch(() => null);


    if (!resposta.ok) {

      throw new Error(
        data?.erro ||
        "Não foi possível chamar o paciente."
      );

    }


    alert(
      `✅ ${nome} foi chamado na TV para o Guichê 01!`
    );

  } catch (error) {

    console.error(
      "Erro na chamada:",
      error
    );

    alert(
      error.message ||
      "Erro ao chamar paciente na TV."
    );

  }

}


// =====================================================
// CLASSIFICAÇÃO DE RISCO
// =====================================================

function classificarRisco(
  sintoma,
  temperatura
) {

  const vermelhos = [

    "infarto",

    "avc",

    "convulsao",

    "hemorragia",

    "falta_ar_grave"

  ];


  const amarelos = [

    "febre",

    "vomito",

    "diarreia",

    "falta_ar_moderada"

  ];


  if (
    !Number.isNaN(
      temperatura
    ) &&
    temperatura >= 39
  ) {

    return "vermelho";

  }


  if (
    vermelhos.includes(
      sintoma
    )
  ) {

    return "vermelho";

  }


  if (
    amarelos.includes(
      sintoma
    )
  ) {

    return "amarelo";

  }


  return "verde";

}


// =====================================================
// SALVAR TRIAGEM
// =====================================================

async function salvar() {

  const btn =
    document.getElementById(
      "btnSalvar"
    );


  const nome =
    document.getElementById(
      "nome"
    ).value.trim();


  const sintoma =
    document.getElementById(
      "sintoma"
    ).value;


  const tempTexto =
    document.getElementById(
      "temp"
    ).value;


  const temperatura =
    tempTexto === ""
      ? null
      : Number(tempTexto);


  const alergia =
    document.getElementById(
      "alergia"
    ).value.trim();


  const observacao =
    document.getElementById(
      "observacao"
    ).value.trim();


  // =============================
  // VALIDAÇÕES
  // =============================

  if (!pacienteSelecionado) {

    alert(
      "Selecione um paciente da fila antes de salvar a triagem."
    );

    return;

  }


  if (!nome) {

    alert(
      "O nome do paciente é obrigatório."
    );

    return;

  }


  if (!sintoma) {

    alert(
      "Selecione o sintoma principal."
    );

    return;

  }


  if (
    temperatura !== null &&
    (
      Number.isNaN(
        temperatura
      ) ||
      temperatura < 30 ||
      temperatura > 45
    )
  ) {

    alert(
      "Digite uma temperatura válida."
    );

    return;

  }


  const risco =
    classificarRisco(
      sintoma,
      temperatura
    );


  // =============================
  // BLOQUEAR BOTÃO
  // =============================

  btn.disabled =
    true;

  btn.textContent =
    "Salvando...";


  try {

    const resposta =
      await fetch(
        "/triagem",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              pacienteId:
                pacienteSelecionado.id,

              nome:
                nome,

              sintoma:
                sintoma,

              temperatura:
                temperatura,

              alergia:
                alergia,

              observacao:
                observacao,

              risco:
                risco

            })

        }
      );


    const data =
      await resposta.json()
        .catch(() => null);


    if (!resposta.ok) {

      throw new Error(
        data?.erro ||
        "Não foi possível salvar a triagem."
      );

    }


    // =============================
    // RESULTADO
    // =============================

    const resultado =
      document.getElementById(
        "resultado"
      );


    resultado.className =
      risco;


    resultado.textContent =
      "Classificação: " +
      risco.toUpperCase();


    resultado.style.display =
      "block";


    alert(
      "✅ Triagem salva com sucesso!"
    );


    // Limpar formulário
    document.getElementById(
      "sintoma"
    ).value = "";

    document.getElementById(
      "temp"
    ).value = "";

    document.getElementById(
      "alergia"
    ).value = "";

    document.getElementById(
      "observacao"
    ).value = "";


    pacienteSelecionado =
      null;


    document.getElementById(
      "nome"
    ).value = "";


    // Atualizar fila
    carregarPacientes();


  } catch (error) {

    console.error(
      "Erro ao salvar triagem:",
      error
    );


    alert(
      error.message ||
      "Erro ao salvar a triagem."
    );

  } finally {

    btn.disabled =
      false;

    btn.textContent =
      "Salvar Triagem";

  }

}


// =====================================================
// INICIALIZAÇÃO
// =====================================================

carregarPacientes();


// Atualiza a fila a cada 10 segundos
setInterval(
  carregarPacientes,
  10000
);

</script>
